# Netlify build settings, versioned with the code (Next.js is detected and served by the Netlify Next.js runtime).
[build]
  command = "pnpm build"
  # Pinned here so a dashboard setting cannot override it: with "/" Netlify uploads the repository root and every
  # path returns its own 404 (the production deploy of 2026-11-25). ".next" lets the Next.js runtime serve the app.
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

# Production builds fail on purpose while content has "[placeholder...]" markers or unapproved legal pages
# (content/index.ts). Deploy previews (CONTEXT=deploy-preview) build normally.
