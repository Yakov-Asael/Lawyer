<!doctype html>
<html lang="he" dir="rtl">
<head><meta charset="utf-8"><meta name="robots" content="noindex"><title>forms</title></head>
<body>
<!-- Netlify Forms detection file (spec 18). Netlify reads this at deploy time; the site posts here with fetch.
     Field names must match REVIEW_FIELDS in src/lib/review-form.ts (unit-tested). Never linked or shown. -->
<form name="review" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input type="hidden" name="form-name" value="review">
  <input name="bot-field">
  <input name="name">
  <input name="area">
  <textarea name="review"></textarea>
  <input name="phone">
  <input name="consent">
</form>
</body>
</html>
